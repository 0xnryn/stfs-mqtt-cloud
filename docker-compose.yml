services:
  stfs-mqtt-cloud:
    # image: stfs-mqtt-cloud:latest
    image: 0xnryn/stfs-mqtt-cloud:latest
    container_name: stfs-mqtt-cloud
    command: /init
    privileged: true
    cgroup: host
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 200M
    volumes:
      - ./stfs-mqtt-vps.txt:/var/lib/sops-nix/key.txt:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Mosquitto persistence database
      - ./mosquitto_db:/var/lib/mosquitto             
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    restart: unless-stopped


