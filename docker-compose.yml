services:
  stfs-mqtt-cloud:
    image: stfs-mqtt-cloud:latest
    container_name: stfs-mqtt-cloud
    command: /init
    privileged: true
    cgroup: host
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 200M
    volumes:
      - ./key.txt:/var/lib/sops-nix/key.txt:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Mosquitto persistence database
      - ./mosquitto.db:/var/lib/mosquitto/mosquitto.db
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    restart: unless-stopped