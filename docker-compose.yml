services:
  stfs-mqtt-cloud:
    image: stfs-mqtt-cloud:latest
    container_name: stfs-mqtt-cloud
    command: /init
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ./key.txt:/var/lib/sops-nix/key.txt:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    restart: unless-stopped